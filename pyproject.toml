[project]
name = "math_experiments"
version = "0.1.0"
description = "Python3.13 code for mathematical experiments"

readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.2.1",
    "pytest>=8.3.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]
