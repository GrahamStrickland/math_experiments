[project]
name = "math_experiments"
version = "0.1.0"
description = "Python3.13 code for mathematical experiments"

readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "astropy>=7.0.0",
    "matplotlib>=3.10.0",
    "networkx>=3.4.2",
    "numpy>=2.2.1",
    "pytest>=8.3.4",
    "python-lsp-server>=1.12.2",
    "rebound>=4.4.6",
    "scipy>=1.15.1",
    "sympy>=1.13.3",
]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["python/test"]
addopts = ["--import-mode=importlib"]

[dependency-groups]
dev = [
    "basedpyright>=1.31.6",
    "isort>=6.1.0",
    "ruff>=0.13.3",
]
